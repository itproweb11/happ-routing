name: Build geo-files and Happ routing

on:
  schedule:
    - cron: "20 4 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "config/**"
      - "custom/**"
      - "scripts/**"
      - ".github/workflows/build.yml"


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Generate lists from opencck
        run: |
          python3 scripts/fetch_opencck.py --outdir build


      - name: Build geosite.dat
        run: |

          git clone --depth 1 https://github.com/v2fly/domain-list-community.git dlc

          git clone --depth 1 https://github.com/hydraponique/roscomvpn-geosite.git rvpn-geosite


          cp -f rvpn-geosite/data/* dlc/data/ || true

          cp build/russia-inside dlc/data/russia-inside || true


          mkdir -p release


          cd dlc


          go run ./ \
            --datapath=./data \
            --outputname=geosite.dat \
            --outputdir="../release"



      - name: Build geoip.dat
        run: |

          git clone --depth 1 https://github.com/v2fly/geoip.git geoip-tool


          curl -fsSL \
          https://github.com/v2fly/geoip/releases/latest/download/geoip.dat \
          -o geoip-tool/upstream-geoip.dat


          cp build/russia-inside.txt geoip-tool/russia-inside.txt || true


          cp config/geoip-custom.json geoip-tool/config-custom.json


          cd geoip-tool


          go run ./ -c config-custom.json


          cp output/geoip.dat ../release/geoip.dat



      - name: Check geoip
        run: |

          echo "Checking geoip.dat"

          strings release/geoip.dat | grep -i ru || true



      - name: Build Happ routing profile
        id: routing
        run: |

          TAG=$(date -u +%Y%m%d%H%M)

          echo "tag=$TAG" >> $GITHUB_OUTPUT


          python3 scripts/build_routing.py --tag "$TAG"



      - name: Commit files
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "github-actions[bot]@users.noreply.github.com"


          git add release HAPP


          git commit -m "build: ${{ steps.routing.outputs.tag }}" || echo "nothing to commit"



      - name: Push changes
        run: |

          git push origin HEAD || true



      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ steps.routing.outputs.tag }}

          files: |
            release/geosite.dat
            release/geoip.dat

        continue-on-error: true
