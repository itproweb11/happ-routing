name: Sync upstream safely

on:
  schedule:
    - cron: "15 3 * * *"

  workflow_dispatch:


permissions:
  contents: write
  actions: write


jobs:

  sync:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout my repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1



      - name: Download upstream
        run: |
          git clone --depth=1 --single-branch \
            https://github.com/b-n-m-n/happ-routing.git \
            /tmp/upstream



      - name: Sync upstream scripts only
        run: |
          mkdir -p scripts

          rsync -a --delete \
            --exclude="build_routing.py" \
            /tmp/upstream/scripts/ \
            scripts/



      - name: Commit upstream updates
        id: commit
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add scripts/


          if git diff --cached --quiet; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "No upstream script changes"


          else

            git commit -m "chore: sync upstream scripts"

            git push origin HEAD


            echo "changed=true" >> "$GITHUB_OUTPUT"


          fi



      - name: Rebuild routing after update
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          gh workflow run build.yml --ref main
