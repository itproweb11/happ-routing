name: Update geoip & geosite

on:
  schedule:
    - cron: '0 3 */3 * *'   # каждые 3 дня в 03:00 UTC
  workflow_dispatch:        # можно запускать вручную

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest files
        run: |
          mkdir -p release
          curl -L -o release/geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -L -o release/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add release/geoip.dat release/geosite.dat
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update geoip.dat & geosite.dat" && git push)
